<h2 mat-dialog-title>Aprobar anticipo N° {{ data.anticipo.codigo }}</h2>

<mat-dialog-content>
  <p class="resumen">
    {{ empleadoNombre() }} — Valor: {{ data.anticipo.valor | number: '1.2-2' }} en
    {{ data.anticipo.numeroCuotas }} cuota(s)
  </p>

  <p class="resumen">El pago queda pendiente de aprobación en la bandeja de tesorería.</p>

  @if (errorMsg()) {
    <div class="aviso aviso-error">{{ errorMsg() }}</div>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-raised-button color="primary" [disabled]="!puedeAprobar" (click)="aprobar()">
    @if (guardando()) {
      <mat-spinner diameter="18"></mat-spinner>
    } @else {
      Aprobar
    }
  </button>
</mat-dialog-actions>
