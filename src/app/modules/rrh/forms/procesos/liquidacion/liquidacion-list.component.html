<div class="pantalla">
  <header class="cabecera">
    <div class="titulos">
      <h1>
        <mat-icon>logout</mat-icon>
        Liquidación de haberes
      </h1>
      <p>
        Simular antes de calcular: el colaborador tiene derecho a ver su finiquito antes de que se
        comprometa. Ejecutar la salida es el paso que no se deshace.
      </p>
    </div>
    <button mat-raised-button color="primary" type="button" (click)="nuevo()">
      <mat-icon>add</mat-icon>
      Nuevo finiquito
    </button>
  </header>

  <app-tabla-rrh
    [columnas]="columnas"
    [filas]="filas()"
    [cargando]="cargando()"
    [estadoInicial]="estadoLista"
    mensajeVacio="Todavía no se ha calculado ningún finiquito."
    (editar)="abrir($event)"
    (estadoCambia)="recordarEstado($event)"
  >
  </app-tabla-rrh>
</div>
