<div class="pantalla">
  <header class="cabecera">
    <div class="titulos">
      <h1>
        <mat-icon>groups</mat-icon>
        Colaboradores
      </h1>
      <p>Pulse una fila para abrir la ficha del colaborador y editar todos sus datos.</p>
    </div>
    <div class="acciones-cabecera">
      <button mat-stroked-button type="button" (click)="exportarCsv()" [disabled]="filas().length === 0">
        <mat-icon>description</mat-icon>
        CSV
      </button>
      @if (!creando()) {
        <button mat-raised-button color="primary" type="button" (click)="abrirCreacion()">
          <mat-icon>person_add</mat-icon>
          Nuevo colaborador
        </button>
      }
    </div>
  </header>

  @if (creando()) {
    <form class="formulario-creacion" [formGroup]="formulario!">
      <div class="grid-campos">
        <mat-form-field appearance="outline">
          <mat-label>Identificación</mat-label>
          <input matInput formControlName="identificacion" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Apellidos</mat-label>
          <input matInput formControlName="apellidos" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Nombres</mat-label>
          <input matInput formControlName="nombres" />
        </mat-form-field>
      </div>

      @if (errorCreacion(); as error) {
        <div class="fila-error">
          <mat-icon>error</mat-icon>
          {{ error }}
        </div>
      }

      <div class="formulario-acciones">
        <button mat-flat-button color="primary" type="button" [disabled]="guardando()" (click)="confirmarCreacion()">
          @if (guardando()) {
            Creando…
          } @else {
            Crear y abrir ficha
          }
        </button>
        <button mat-stroked-button type="button" (click)="cancelarCreacion()">Cancelar</button>
      </div>
    </form>
  }

  <app-tabla-rrh
    [columnas]="columnas"
    [filas]="filas()"
    [cargando]="cargando()"
    [permiteBorrar]="false"
    [estadoInicial]="estadoLista"
    mensajeVacio="Todavía no hay colaboradores registrados."
    (editar)="abrir($event)"
    (estadoCambia)="recordarEstado($event)"
  >
  </app-tabla-rrh>
</div>
