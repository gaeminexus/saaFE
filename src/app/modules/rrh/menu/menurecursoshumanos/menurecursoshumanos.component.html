<app-side-menu-custom [title]="titulo" [navItems]="navItems">
  @if (alertaAcreditacion(); as alerta) {
    <div top-banner class="alertas-rrhh">
      <a
        class="chip-alerta"
        (click)="irAAcreditarVacaciones()"
        matTooltip="Ir a Procesos → Acreditar vacaciones"
      >
        <mat-icon>warning</mat-icon>
        <span>{{ alerta }}</span>
      </a>
    </div>
  }
</app-side-menu-custom>
